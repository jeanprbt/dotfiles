# Theme
include rose-pine-dawn.conf

# Font
font_family MesloLGS Nerd Font Mono
bold_font auto
italic_font auto
bold_italic_font auto
font_size 14

# Tab bar (see https://github.com/kovidgoyal/kitty/discussions/4447#discussioncomment-8736005)
tab_bar_edge top
tab_bar_margin_width 15.0
tab_bar_margin_height 15.0 0.0
tab_bar_style custom
tab_bar_align left
tab_bar_min_tabs 1
tab_separator " "
tab_title_template "{fmt.bg.default}{fmt.fg._ea9a97}  {sup.index}  {title}{bell_symbol}{activity_symbol}  {fmt.fg.default}"
active_tab_title_template "{fmt.bg.default}{fmt.fg._ea9a97}{fmt.bg._ea9a97}{fmt.fg._faf4ed} {index}  {title}{bell_symbol}{activity_symbol} {fmt.bg.default}{fmt.fg._ea9a97}{fmt.bg.default}{fmt.fg.default}"

# Shell integration & remote control
shell_integration enabled
allow_remote_control yes
listen_on unix:/tmp/mykitty

# Option key
# macos_option_as_alt yes

# URLs
url_style straight

# Editor
editor /opt/homebrew/bin/nvim

# Key bindings
map ctrl+shift+l no_op

# Window
map cmd+n next_layout
enabled_layouts splits,stack
remember_window_size no
initial_window_width 110c
initial_window_height 30c
window_padding_width 6
confirm_os_window_close 0

## Windows resizing
map cmd+r no_op
map cmd+left resize_window wider 4
map cmd+right resize_window narrower 4
map cmd+up resize_window taller 4
map cmd+down resize_window shorter 4

## Windows management
map ctrl+: launch --location=vsplit --cwd=current
map ctrl+minus launch --location=hsplit --cwd=current
map cmd+k clear_terminal scroll active
map cmd+q quit

## Windows navigation (keys are forwarded to tmux, fzf & nvim (ctrl+j/k only) instead, see neighboring_window.py)
map ctrl+j kitten neighboring_window.py bottom ctrl+j
map ctrl+k kitten neighboring_window.py top ctrl+k
map ctrl+h kitten neighboring_window.py left ctrl+h
map ctrl+l kitten neighboring_window.py right ctrl+l

## Scrollback
scrollback_pager env LANG=en_US.UTF-8 LESSUTFCHARDEF=e000-f8ff:p,f0000-ffffd:p less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER
map cmd+f show_scrollback

## Config
map cmd+shift+r load_config_file

## Broadcast
map cmd+b launch --allow-remote-control kitty +kitten broadcast --match-tab state:focused
